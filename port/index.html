<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Destroyer</title>
<style>
  :root {
    --bg: #0b0d0b;
    --panel: #141814;
    --line: #2a332a;
    --ink: #cfe8cf;
    --dim: #7d8f7d;
    --warn: #e8b04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 4px 0 2px;
  }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; text-align: center; }
  .stage {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px;
    line-height: 0;
    max-width: 100%;
  }
  canvas {
    display: block;
    width: 840px;
    max-width: calc(100vw - 54px);
    height: auto;
    aspect-ratio: 280 / 192;
    image-rendering: pixelated;
    background: #000;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 9px 12px;
    min-width: 150px;
  }
  .card h2 {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 6px; font-weight: 600;
  }
  .kv { display: flex; justify-content: space-between; gap: 14px; }
  .kv span:last-child { color: #fff; }
  button, select {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--dim); }
  button:disabled { opacity: 0.45; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .note {
    margin-top: 14px; max-width: 840px; color: var(--dim); font-size: 11px;
    border-left: 2px solid var(--line); padding-left: 10px;
  }
  .note b { color: var(--warn); font-weight: 600; }
  .over {
    margin-top: 10px; color: var(--warn); min-height: 1.5em; text-align: center;
    max-width: 840px;
  }
  .help { color: var(--dim); font-size: 11px; margin-top: 8px; }
  .help kbd {
    background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
    padding: 1px 5px; color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f3; --panel: #fff; --line: #d7dcd5; --ink: #1d231d; --dim: #5d6a5d;
    }
  }
</style>
</head>
<body>

<h1>Star Destroyer</h1>
<div class="sub">
  Harvest Time Software, &copy; 1983 Mitchell Robbins &mdash; the port's flight loop,
  running at the disk's own 2.57 frames a second
</div>

<div class="stage"><canvas id="screen" width="280" height="192"></canvas></div>

<div class="controls">
  <button id="boot">Boot the disk</button>
  <button id="start">Skip to a flight</button>
  <button id="pause" disabled>Pause</button>
  <label>difficulty
    <select id="difficulty">
      <option value="1">1 &mdash; easy</option>
      <option value="2">2 &mdash; medium</option>
      <option value="3">3 &mdash; hard</option>
    </select>
  </label>
  <label>frames/sec
    <select id="fps"></select>
  </label>
  <label>display
    <select id="tint">
      <option value="colour">colour</option>
      <option value="green">green screen</option>
      <option value="amber">amber screen</option>
      <option value="white">white screen</option>
    </select>
  </label>
  <label><input type="checkbox" id="mute"> mute</label>
  <button id="clear-scores" title="CLEAR SCORES, the utility on the disk">Clear scores</button>
</div>

<div class="help" id="help"></div>
<div class="help" id="fps-note"></div>
<div class="over" id="over"></div>

<div class="row">
  <div class="card">
    <h2>ship</h2>
    <div class="kv"><span>shields</span><span id="s-shields">&mdash;</span></div>
    <div class="kv"><span>warp</span><span id="s-warp">&mdash;</span></div>
    <div class="kv"><span>missiles</span><span id="s-missiles">&mdash;</span></div>
    <div class="kv"><span>hits taken</span><span id="s-hits">&mdash;</span></div>
  </div>
  <div class="card">
    <h2>wave</h2>
    <div class="kv"><span id="l-waves">left to send</span><span id="s-waves">&mdash;</span></div>
    <div class="kv"><span id="l-kills">kills</span><span id="s-kills">&mdash;</span></div>
    <div class="kv"><span id="l-passes">passes</span><span id="s-passes">&mdash;</span></div>
  </div>
  <div class="card">
    <h2>speaker</h2>
    <div class="kv"><span>last</span><span id="s-sounds">&mdash;</span></div>
  </div>
</div>

<div class="note" id="note"></div>

<script type="module">
// The loader, and nothing else. The wiring lives in src/shell/page.js, where a harness can
// reach it - see the note at the top of that file for why it moved.
import { wire } from './src/shell/page.js';
import { Shell, HELP, FPS_CHOICES, DISK_FPS } from './src/shell/main.js';
import { Boot } from './src/shell/boot.js';
import { browserSaves } from './src/platform/saves.js';

window.__sd = wire(document, {
  Shell,
  Boot,
  HELP,
  FPS_CHOICES,
  DISK_FPS,
  // The high-score file, kept in this browser. The page owns it rather than a driver,
  // because Clear has to work before the disk is booted as well as after.
  saves: browserSaves(),
  fetchImage: async () => {
    const r = await fetch('../disk/STAR_DESTROYER.dsk');
    if (!r.ok) throw new Error(`could not fetch the disk image: ${r.status} ${r.statusText}`);
    return new Uint8Array(await r.arrayBuffer());
  },
});
</script>
</body>
</html>
