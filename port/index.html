<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Destroyer</title>
<style>
  :root {
    --bg: #0b0d0b;
    --panel: #141814;
    --line: #2a332a;
    --ink: #cfe8cf;
    --dim: #7d8f7d;
    --warn: #e8b04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 4px 0 2px;
  }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; text-align: center; }
  .stage {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px;
    line-height: 0;
    max-width: 100%;
  }
  canvas {
    display: block;
    width: 840px;
    max-width: calc(100vw - 54px);
    height: auto;
    aspect-ratio: 280 / 192;
    image-rendering: pixelated;
    background: #000;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 9px 12px;
    min-width: 150px;
  }
  .card h2 {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 6px; font-weight: 600;
  }
  .kv { display: flex; justify-content: space-between; gap: 14px; }
  .kv span:last-child { color: #fff; }
  button, select {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--dim); }
  button:disabled { opacity: 0.45; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .note {
    margin-top: 14px; max-width: 840px; color: var(--dim); font-size: 11px;
    border-left: 2px solid var(--line); padding-left: 10px;
  }
  .note b { color: var(--warn); font-weight: 600; }
  .over {
    margin-top: 10px; color: var(--warn); min-height: 1.5em; text-align: center;
    max-width: 840px;
  }
  .help { color: var(--dim); font-size: 11px; margin-top: 8px; }
  .help kbd {
    background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
    padding: 1px 5px; color: var(--ink);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f3; --panel: #fff; --line: #d7dcd5; --ink: #1d231d; --dim: #5d6a5d;
    }
  }
</style>
</head>
<body>

<h1>Star Destroyer</h1>
<div class="sub">
  Harvest Time Software, &copy; 1983 Mitchell Robbins &mdash; the port's flight loop,
  running at the disk's own 2.57 frames a second
</div>

<div class="stage"><canvas id="screen" width="280" height="192"></canvas></div>

<div class="controls">
  <button id="boot">Boot the disk</button>
  <button id="start">Skip to a flight</button>
  <button id="pause" disabled>Pause</button>
  <label>difficulty
    <select id="difficulty">
      <option value="1">1 &mdash; easy</option>
      <option value="2">2 &mdash; medium</option>
      <option value="3">3 &mdash; hard</option>
    </select>
  </label>
  <label>frames/sec
    <select id="fps"></select>
  </label>
  <label>display
    <select id="tint">
      <option value="colour">colour</option>
      <option value="green">green screen</option>
      <option value="amber">amber screen</option>
      <option value="white">white screen</option>
    </select>
  </label>
  <label><input type="checkbox" id="mute"> mute</label>
</div>

<div class="help" id="help"></div>
<div class="help" id="fps-note"></div>
<div class="over" id="over"></div>

<div class="row">
  <div class="card">
    <h2>ship</h2>
    <div class="kv"><span>shields</span><span id="s-shields">&mdash;</span></div>
    <div class="kv"><span>warp</span><span id="s-warp">&mdash;</span></div>
    <div class="kv"><span>missiles</span><span id="s-missiles">&mdash;</span></div>
    <div class="kv"><span>hits taken</span><span id="s-hits">&mdash;</span></div>
  </div>
  <div class="card">
    <h2>wave</h2>
    <div class="kv"><span id="l-waves">left to send</span><span id="s-waves">&mdash;</span></div>
    <div class="kv"><span id="l-kills">kills</span><span id="s-kills">&mdash;</span></div>
    <div class="kv"><span id="l-passes">passes</span><span id="s-passes">&mdash;</span></div>
  </div>
  <div class="card">
    <h2>speaker</h2>
    <div class="kv"><span>last</span><span id="s-sounds">&mdash;</span></div>
  </div>
</div>

<div class="note" id="note"></div>

<script type="module">
import { Shell, HELP, FPS_CHOICES, DISK_FPS } from './src/shell/main.js';
import { Boot } from './src/shell/boot.js';

const canvas = document.getElementById('screen');
const $ = (id) => document.getElementById(id);
let shell = new Shell(canvas);
let boot = null;
let image = null;

$('help').innerHTML = HELP
  .map(([k, what]) => `<kbd>${k}</kbd> ${what}`).join(' &nbsp; ');

$('fps').innerHTML = FPS_CHOICES.map(({ fps, label }) =>
  `<option value="${fps}">${fps.toFixed(fps < 10 ? 2 : 0)} &mdash; ${label}</option>`).join('');
$('fps').value = String(DISK_FPS);

const fpsNote = () => {
  const fps = Number($('fps').value);
  $('fps-note').textContent = fps <= DISK_FPS + 0.01
    ? 'the original: one pass is 397,000 cycles, of which 80% is the renderer'
    : `${(fps / DISK_FPS).toFixed(1)}× the original speed — a pass is a whole tick of `
      + 'game state as well as a frame, so this speeds the game up rather than smoothing it';
};

/**
 * Set a node's text only when it differs.
 *
 * The two status handlers run once a frame, so every one of these was a DOM write sixty times
 * a second for a string that changes a few times a minute - and `note` was an `innerHTML`,
 * which tears the nodes down and parses them again each time.
 */
const put = (id, text) => {
  const el = $(id);
  if (el.textContent !== text) el.textContent = text;
};
const putHTML = (id, html) => {
  const el = $(id);
  if (el.innerHTML !== html) el.innerHTML = html;
};

const show = (s) => {
  // The three gauges are the far end of a bar in the display list, not a percentage: a hit
  // shrinks one by STEP and EMPTY is where it bottoms out. Showing both the operand and the
  // steps left keeps the panel honest about what is actually in memory.
  const gauge = (v) => (v === 0 ? 'empty'
    : `${v} · ${Math.max(0, Math.floor((v - s.empty) / s.step))} left`);
  $('s-shields').textContent = gauge(s.shields);
  $('s-warp').textContent = gauge(s.warp);
  $('s-missiles').textContent = gauge(s.missiles);
  $('s-hits').textContent = `${s.hits} of ${s.fatal}`;
  $('s-waves').textContent = s.waves.join(' / ');
  $('s-kills').textContent = s.kills.join(' / ');
  $('s-passes').textContent = s.passes;
  $('s-sounds').textContent = s.sounds.length ? s.sounds.join(', ') : '—';
  $('pause').textContent = s.paused ? 'Resume' : 'Pause';
  const why = shell.reason();
  $('over').textContent = why ? why : (s.paused ? 'paused' : '');
};

/** The flight the BASIC set up, in the BASIC's own terms. */
const note = (s) => {
  if (!s || !s.intended) { $('note').textContent = ''; return; }
  $('note').innerHTML =
    `<b>This flight:</b> ${s.intended.waves.join(' + ')} enemies to clear, `
    + `and ${s.intended.target} flights to survive.`;
};

async function loadImage() {
  if (image) return image;
  const r = await fetch('../disk/STAR_DESTROYER.dsk');
  if (!r.ok) throw new Error(`could not fetch the disk image: ${r.status} ${r.statusText}`);
  image = new Uint8Array(await r.arrayBuffer());
  return image;
}

/**
 * The driver the controls should talk to.
 *
 * There are two and only one runs at a time: `Shell` flies a single mission, `Boot` runs the
 * whole disk and hands off to a mission when the chain BRUNs one. **Each owns its own Audio,
 * its own tint and its own frame rate**, and the controls below were all bound to `shell` - so
 * once the disk was booted, the mute checkbox, the display tint and the frames/sec menu were
 * setting properties on an object that was not running. Mute doing nothing is how it was
 * noticed; the other two were just as dead.
 */
let booted = false;
const active = () => (booted && boot ? boot : shell);

async function fly() {
  $('start').disabled = true;
  $('start').textContent = 'Loading…';
  try {
    const img = await loadImage();
    shell.stop();
    // And the other driver, which this did not do: both loops went on painting the same
    // canvas, and both Audios went on playing.
    if (boot) { boot.stop(); boot = null; }
    booted = false;
    shell = new Shell(canvas, {
      fps: Number($('fps').value),
      tint: $('tint').value,
    });
    shell.audio.setMuted($('mute').checked);
    shell.onStatus = (s) => show(s);
    const info = shell.load(img, Number($('difficulty').value));
    note(shell.status());
    show(shell.status());
    shell.start();
    $('pause').disabled = false;
    $('start').textContent = 'Reload and fly again';
    console.log('loaded, in order:', info.loaded);
  } catch (e) {
    $('over').textContent = String(e.message || e);
    console.error(e);
  } finally {
    $('start').disabled = false;
  }
}

async function bootDisk() {
  $('boot').disabled = true;
  $('boot').textContent = 'Booting…';
  try {
    const img = await loadImage();
    shell.stop();
    if (boot) boot.stop();
    boot = new Boot(canvas, img, {
      fps: Number($('fps').value),
      tint: $('tint').value,
    });
    booted = true;
    boot.audio.setMuted($('mute').checked);
    boot.onStatus = (s) => {
      // The flight panel's labels do not describe a presentation screen, so say what these
      // actually are rather than leaving "kills: hires page 1 full" on the screen.
      put('l-waves', 'program');
      put('l-kills', 'display');
      put('s-waves', s.program ?? '—');
      put('s-kills', s.display ?? '—');
      put('s-passes', String(s.flights));
      put('s-sounds', s.state);

      // The four SHIP rows, which this handler used to leave at their em-dashes for the whole
      // of a flight - the screen drew the three bars and the panel beside it said nothing.
      // `fatal` follows the mission: the finale dies at two hits where a flight takes four.
      const gauge = (v) => (v === 0 ? 'empty'
        : `${v} · ${Math.max(0, Math.floor((v - s.empty) / s.step))} left`);
      const flying = s.state === 'flight';
      put('s-shields', flying ? gauge(s.shields) : '—');
      put('s-warp', flying ? gauge(s.warp) : '—');
      put('s-missiles', flying ? gauge(s.missiles) : '—');
      put('s-hits', flying ? `${s.hits} of ${s.fatal}` : '—');
      put('l-passes', s.finale ? 'flights · FINALE' : 'flights');
      put('pause', s.paused ? 'Resume' : 'Pause');
      put('over', s.error ? s.error
        : s.silent ? `the sound stopped: ${s.silent} — the game carries on`
        : (s.waiting === 'key' ? 'press a key' : ''));
      const gaps = s.unimplemented || [];
      putHTML('note', gaps.length
        ? '<b>Not ported yet, and reached:</b> '
          + gaps.map((g) => `${g.what} (${g.n}×)`).join('; ')
        : '');
    };
    boot.start();
    $('pause').disabled = false;
    $('pause').textContent = 'Pause';
    $('boot').textContent = 'Reboot';
  } catch (e) {
    $('over').textContent = String(e.message || e);
    console.error(e);
  } finally {
    $('boot').disabled = false;
  }
}

$('boot').addEventListener('click', bootDisk);
$('start').addEventListener('click', fly);
$('pause').addEventListener('click', () => {
  const d = active();
  d.paused = !d.paused;
  d.audio.resume();
  // `Boot` repaints and reports from its own loop; only the shell needs the nudge.
  if (d === shell) show(shell.status());
  else $('pause').textContent = d.paused ? 'Resume' : 'Pause';
});
$('mute').addEventListener('change', (e) => active().audio.setMuted(e.target.checked));
$('tint').addEventListener('change', (e) => {
  const d = active();
  d.tint = e.target.value;
  d.draw();
});
$('fps').addEventListener('change', (e) => {
  active().fps = Number(e.target.value);
  fpsNote();
});
fpsNote();

// For poking at it from the console, and for a harness later.
window.__sd = { get shell() { return shell; }, get boot() { return boot; } };
</script>
</body>
</html>
